name: Postgame NFL Feed Validation and Sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [nfl-game-final]
  schedule:
    # Window-scoped post-game runs strictly outside 02:30-06:30 CST (08:30-12:30 UTC)
    - cron: "35 21 * * 0"
    - cron: "55 0 * * 1"
    - cron: "50 4 * * 1,2,5"
    - cron: "15 14 * * *"

permissions:
  contents: read

# One run at a time: overlapping crons/dispatches double the Neon wake cost the
# sleep-window guard exists to avoid, and race each other on the same snapshot row.
concurrency:
  group: postgame-nfl-sync
  cancel-in-progress: false

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot silently change what runs
      # with the sync secrets. Version kept in the comment for reviewers.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Pinned: an unpinned install means whatever pytest/pluggy ships that morning runs
      # next to the Neon and R2 credentials.
      - name: Install test dependencies
        run: pip install "pytest==9.2.0"

      - name: Run post-game feed test suite
        run: python -m pytest -v

      - name: Validate dataset and run configured sync
        run: python workers/sync_nfl_postgame_to_neon_r2.py --validate-if-unconfigured
